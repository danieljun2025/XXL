<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatchGamers</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2933;--muted:#667085;--line:#e4e7ec;--brand:#2f6fed}
@media (prefers-color-scheme:dark){:root{--bg:#12151a;--card:#1b2028;--text:#e6e9ef;--muted:#9aa4b2;--line:#2c3440;--brand:#6c9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:36px 16px 60px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.crumb{font-size:.9rem;margin-bottom:12px}.crumb a{color:var(--brand);text-decoration:none}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none}
a.item:hover,a.item:focus-visible{border-color:var(--brand);outline:none}
.t{font-weight:600}.d{color:var(--muted);font-size:.92rem}.path{color:var(--muted);font-size:.8rem;font-family:ui-monospace,Menlo,monospace}
.arrow{color:var(--brand);font-size:1.3rem}
</style>
</head>
<body>
<main>
<h1>MatchGamers</h1>
<p class="sub">选择一个项目进入</p>
<ul>
<li><a class="item" href="game/xxl/"><span><span class="t">消消乐 XXL</span><br><span class="d">三消闯关，含特殊道具</span><br><span class="path">/game/xxl/</span></span><span class="arrow" aria-hidden="true">›</span></a></li>
<li><a class="item" href="https://anchor.matchgamers.com/"><span><span class="t">职业锚测试</span><br><span class="d">40 题自测，生成你的职业锚报告，结果会保存，可用邮箱和密钥回看</span><br><span class="path">anchor.matchgamers.com</span></span><span class="arrow" aria-hidden="true">›</span></a></li>
</ul>
</main>
</body>
</html>
