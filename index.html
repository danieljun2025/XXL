<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职业锚测试</title>
<meta name="description" content="40 题、约 10 分钟，生成你的职业锚报告，可保存为图片。">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2933;--muted:#667085;--line:#e4e7ec;--brand:#2f6fed;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12151a;--card:#1b2028;--text:#e6e9ef;--muted:#9aa4b2;--line:#2c3440;--brand:#6c9bff;--on:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:56px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
h1{font-size:1.7rem;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
ul{margin:0 0 24px;padding-left:1.2em;color:var(--muted)}
.cta{display:inline-block;background:var(--brand);color:var(--on);text-decoration:none;padding:12px 28px;border-radius:12px;font-weight:600}
.cta:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.note{color:var(--muted);font-size:.85rem;margin-top:20px}.note a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>职业锚测试</h1>
    <p class="sub">看清你真正看重的职业动机</p>
    <ul>
      <li>40 题，约 10 分钟，每题自动保存</li>
      <li>立刻生成报告：主职业锚、雷达图、优势与盲区、行动建议</li>
      <li>报告可保存为图片，之后可凭邮箱和查看密钥回看</li>
    </ul>
    <a class="cta" href="https://anchor.matchgamers.com/">开始测试</a>
    <p class="note">测评基于职业锚理论，仅作为自我认知参考，不构成录用、诊断或其他决策依据。</p>
    <p class="note" style="margin-top:8px"><a href="https://anchor.matchgamers.com/privacy.html">隐私说明</a> · <a href="https://anchor.matchgamers.com/terms.html">服务说明与退款规则</a></p>
  </div>
</main>
</body>
</html>
