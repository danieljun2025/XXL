<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>统计报表</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>
.wrap{max-width:1040px}
.crumb a{color:var(--brand);text-decoration:none}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.head h1{margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.panel h2{margin:0 0 2px;font-size:1.05rem}
.panel .muted{margin:0 0 12px}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:780px){.grid2{grid-template-columns:1fr}}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpis div{background:var(--bg);padding:10px 12px;border-radius:10px;font-size:.88rem;color:var(--muted)}
.kpis b{display:block;font-size:1.5rem;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.3}
.ring-t{font-size:30px;font-weight:700;fill:var(--text)}.ring-s{font-size:12px;fill:var(--muted)}
.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}.lbl{font-size:12px;fill:var(--text)}
.radar-t{paint-order:stroke;stroke:var(--card);stroke-width:3px}.gridl{stroke:var(--line);stroke-width:1;fill:none}
.hb{display:grid;gap:7px}.hb-row{display:grid;grid-template-columns:7.2em 1fr 5.8em;gap:10px;align-items:center;cursor:default}
.hb-l{font-size:.9rem}.hb-t{height:14px;background:var(--bg);border-radius:3px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--brand);border-radius:0 3px 3px 0;transition:opacity .15s}
.hb-row:hover .hb-t i{opacity:.8}.hb-v{font-variant-numeric:tabular-nums;text-align:right;font-size:.88rem}
.hb-row.top .hb-l{font-weight:700}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.bar{fill:var(--brand)}.bar:hover{opacity:.8}
.area{fill:var(--brand);fill-opacity:.14}.line{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round}
.dot{fill:var(--brand);stroke:var(--card);stroke-width:2}
.cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.shape{fill:var(--brand);fill-opacity:.22;stroke:var(--brand);stroke-width:2}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.82rem;line-height:1.4;white-space:nowrap;opacity:0;transition:opacity .1s}
details{margin-top:6px}summary{cursor:pointer;color:var(--brand);font-size:.9rem}
table{font-size:.9rem;font-variant-numeric:tabular-nums}.n{text-align:right}
</style>
</head>
<body><main id="app" class="wrap"></main><div id="tip" role="tooltip"></div><script src="/report.js"></script></body>
</html>
