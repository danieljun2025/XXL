<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队管理</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>
.wrap{max-width:1040px}.crumb a{color:var(--brand);text-decoration:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;min-width:0}
.panel h2{margin:0 0 10px;font-size:1.05rem}
.gen{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:flex-end}.gen label{margin:0}
.gen input[type=text],.gen input[type=number]{padding:11px 12px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);max-width:100%}
#tn{width:14em}#tnote{width:16em}#cc,#hrs,#mu{width:9em}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.big{font-size:1.6rem;font-weight:700;letter-spacing:.1em;color:var(--brand);margin:2px 0}
.result{border:2px solid var(--brand);border-radius:12px;padding:14px 16px;margin-top:14px}
.result .row{margin-top:8px}.warn{color:var(--err);font-size:.9rem}
.cline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:2px 0}.small{font-size:.8rem}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px 4px 2px 0;font-size:.85rem}
.tw{overflow-x:auto}td button,td a.btn{padding:4px 10px;font-size:.85rem;margin:2px 4px 2px 0}a.btn{display:inline-block;border:1px solid var(--brand);color:var(--brand);border-radius:10px;text-decoration:none}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.8rem}.pill.on{background:var(--sel);color:var(--brand)}.pill.off{background:var(--bg);color:var(--muted)}
.tabs button{flex:0 0 auto}
</style>
</head>
<body data-tab="teams"><main id="app" class="wrap"></main><script src="/admin-nav.js"></script><script src="/teams.js"></script></body>
</html>
