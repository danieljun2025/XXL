<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职业锚后台</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>.wrap{max-width:1000px}.tw{overflow-x:auto}td button{padding:4px 10px;font-size:.85rem;margin-right:4px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0 8px}.kpis div{background:var(--bg);padding:10px 12px;border-radius:10px;font-size:.9rem;color:var(--muted)}.kpis b{display:block;font-size:1.5rem;color:var(--text);font-variant-numeric:tabular-nums}
.hb{display:grid;gap:8px;margin:8px 0 18px}.hb-row{display:grid;grid-template-columns:7.5em 1fr 5.5em;gap:10px;align-items:center}.hb-l{font-size:.92rem}.hb-t{height:12px;background:var(--line);border-radius:3px;overflow:hidden}.hb-t i{display:block;height:100%;background:var(--brand);border-radius:0 3px 3px 0}.hb-v{font-variant-numeric:tabular-nums;text-align:right;font-size:.9rem}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);margin-top:8px}.col{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}.col i{display:block;width:100%;min-height:2px;background:var(--brand);border-radius:3px 3px 0 0}.cols-x{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin:4px 0 12px;gap:8px}</style>
</head>
<body><main id="app" class="wrap"></main><script src="/admin.js"></script></body>
</html>
