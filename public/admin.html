<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职业锚后台</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>.wrap{max-width:1100px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpis div{background:var(--bg);padding:10px 12px;border-radius:10px;font-size:.88rem;color:var(--muted)}.kpis b{display:block;font-size:1.5rem;color:var(--text);font-variant-numeric:tabular-nums}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}.panel h2{margin:0 0 10px;font-size:1.05rem}.qa{display:flex;gap:10px;flex-wrap:wrap}.qa a,.qa button{display:inline-block;padding:8px 16px;border-radius:10px;border:1px solid var(--brand);color:var(--brand);background:transparent;text-decoration:none;font:inherit;cursor:pointer}</style>
</head>
<body data-tab="overview"><main id="app" class="wrap"></main><script src="/admin-nav.js"></script><script src="/admin.js"></script></body>
</html>
