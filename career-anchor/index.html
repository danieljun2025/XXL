<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职业锚测试</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2933;--muted:#667085;--line:#e4e7ec;--brand:#2f6fed;--brand-d:#1f55c4;--ok:#12805c;--err:#c0392b;--sel:#e8f0fe;--on:#fff;--warn:#b45309;--good:#12805c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--card:#1b2028;--text:#e6e9ef;--muted:#9aa4b2;--line:#2c3440;--brand:#6c9bff;--brand-d:#8db0ff;--ok:#4cc29a;--err:#ff7b6b;--sel:#22314f;--on:#0b1220;--warn:#f0b35a;--good:#4cc29a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151a;--card:#1b2028;--text:#e6e9ef;--muted:#9aa4b2;--line:#2c3440;--brand:#6c9bff;--brand-d:#8db0ff;--ok:#4cc29a;--err:#ff7b6b;--sel:#22314f;--on:#0b1220;--warn:#f0b35a;--good:#4cc29a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:14px 0}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.25rem;margin:.2em 0 .6em}h3{font-size:1.05rem;margin:1em 0 .3em}
p{margin:.5em 0}.muted{color:var(--muted);font-size:.92rem}
label{display:block;margin:14px 0 4px;font-weight:600}
input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 12px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
input:focus-visible,button:focus-visible,.opt:focus-within{outline:3px solid var(--brand);outline-offset:1px}
button{font:inherit;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:10px 20px;border-radius:10px}
button:hover{background:var(--brand-d)}button.ghost{background:transparent;color:var(--brand)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.err{color:var(--err);margin-top:10px;min-height:1.4em}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1;background:transparent;color:var(--text);border-color:var(--line)}
.tabs button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);transition:width .25s}
.q{padding:14px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.q p{font-weight:600;margin:0 0 8px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.opt{position:relative;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 0;cursor:pointer;user-select:none}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt:has(input:checked){background:var(--brand);color:#fff;border-color:var(--brand)}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:4px}
.pick{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.pick:has(input:checked){background:var(--sel);border-color:var(--brand)}
.badge{display:inline-block;background:var(--sel);color:var(--brand);padding:2px 10px;border-radius:99px;font-size:.85rem;margin-right:6px}
.hero{border-left:6px solid var(--brand)}
.tag-list{padding-left:1.2em;margin:.3em 0}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.score-bar{height:10px;background:var(--line);border-radius:6px;min-width:80px}.score-bar i{display:block;height:100%;border-radius:6px;background:var(--brand)}
.radar{width:100%;max-width:420px;display:block;margin:0 auto}
.radar text{fill:var(--text);font-size:12px}.radar .grid{fill:none;stroke:var(--line)}.radar .shape{fill:var(--brand);fill-opacity:.25;stroke:var(--brand);stroke-width:2}
.hist li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);list-style:none}
.hist{padding:0;margin:0}
@media (max-width:520px){.scale{gap:4px}.card{padding:16px}}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.card{border:1px solid #ccc;break-inside:avoid}}

/* ---- 结果报告 ---- */
.rhero{background:var(--brand);color:var(--on);border-radius:16px;padding:22px;margin:14px 0}
.rhero .meta{font-size:.85rem;opacity:.85;margin:0}.rhero h1{color:inherit;margin:.15em 0 .1em}.rhero .lead{margin:.6em 0 .2em;opacity:.9}
.pa{display:flex;gap:14px;align-items:center;margin-top:10px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--on) 16%,transparent)}
.pcode{flex:none;width:54px;height:54px;border-radius:12px;background:var(--on);color:var(--brand);font-weight:800;font-size:1.25rem;display:grid;place-items:center}
.pa-t{flex:1;min-width:0}.pa-t b{display:block;font-size:1.2rem}.pa-t span{font-size:.9rem;opacity:.92}
.pscore{flex:none;font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}.pscore small{font-size:.75rem;font-weight:500;opacity:.8}
.profile{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:640px){.profile{grid-template-columns:1fr}}
.radar .tick{font-size:9px;fill:var(--muted);paint-order:stroke;stroke:var(--card);stroke-width:3px}
.radar .rl{font-size:12px;fill:var(--muted)}.radar .rl.main{fill:var(--text);font-weight:700}
.radar .rs{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}.radar .rs.main{fill:var(--brand);font-weight:700}
.radar .pdot{fill:var(--brand);stroke:var(--card);stroke-width:2.5}.radar .odot{fill:var(--brand);fill-opacity:.55}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rank li{display:grid;grid-template-columns:1.4em 6.6em 1fr 2.4em;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;font-size:.92rem}
.rank li.main{background:var(--sel);font-weight:700}
.rn{color:var(--muted);font-variant-numeric:tabular-nums}.rbar{height:10px;background:var(--line);border-radius:3px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--brand);opacity:.45;border-radius:0 3px 3px 0}.rank li.main .rbar i{opacity:1}
.rval{text-align:right;font-variant-numeric:tabular-nums}
.small{font-size:.82rem}
.en{font-size:.8rem;font-weight:400;color:var(--muted);margin-left:6px}
.motive{margin:.2em 0 14px;padding:12px 14px;background:var(--sel);border-radius:10px}.motive b{display:block;font-size:.8rem;color:var(--brand);margin-bottom:2px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:640px){.dgrid{grid-template-columns:1fr}}
.dbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.dbox h3{margin:0 0 6px;font-size:.95rem}
.dbox.good h3{color:var(--good)}.dbox.warn h3{color:var(--warn)}
.dbox .tag-list{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.dbox .tag-list li{position:relative;padding-left:16px;font-size:.93rem}
.dbox .tag-list li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.dbox.good .tag-list li::before{background:var(--good)}.dbox.warn .tag-list li::before{background:var(--warn)}
.avoid{margin:12px 0 0;font-size:.92rem;color:var(--muted)}.avoid b{color:var(--text)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:640px){.sgrid{grid-template-columns:1fr}}
.sbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.sbox p{margin:.3em 0 0;font-size:.92rem;color:var(--muted)}
.sh{display:flex;justify-content:space-between;align-items:baseline}.sh span{font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
h1:focus,h2:focus{outline:none}

.banner{background:var(--sel);border-bottom:1px solid var(--line);padding:8px 16px;font-size:.88rem;text-align:center}
</style>
</head>
<body>
<div class="banner noprint">你的答题数据只保存在当前设备的浏览器中，不会上传到任何服务器。</div>
<main id="app" class="wrap" aria-live="polite"></main>
<script>
(function () {
const QUESTIONS = [
  {"id": 1, "anchor": "TF", "text": "我最看重的是在自己擅长的专业领域里不断做得更精、更深。"},
  {"id": 2, "anchor": "TF", "text": "如果必须在升任管理者和继续做专业工作之间选择，我宁愿留在专业岗位上。"},
  {"id": 3, "anchor": "TF", "text": "被同行认可为某个领域的专家，会带给我最大的成就感。"},
  {"id": 4, "anchor": "TF", "text": "我希望工作能持续运用并发展我的专业技能。"},
  {"id": 5, "anchor": "TF", "text": "我不愿意接受会让我远离专业核心工作的职位调动。"},
  {"id": 6, "anchor": "GM", "text": "我希望有一天能成为组织的高层负责人，对整体成果负责。"},
  {"id": 7, "anchor": "GM", "text": "协调不同的人和部门朝同一个目标前进，让我很有成就感。"},
  {"id": 8, "anchor": "GM", "text": "我愿意承担更大的责任，哪怕这意味着要做艰难的决策。"},
  {"id": 9, "anchor": "GM", "text": "我认为职业成功的标志，是晋升到能够影响全局的位置。"},
  {"id": 10, "anchor": "GM", "text": "相比钻研某项技术细节，我更喜欢分析全局并整合各方资源。"},
  {"id": 11, "anchor": "AU", "text": "我希望自己能决定工作的内容、节奏和方式，少受规章制度约束。"},
  {"id": 12, "anchor": "AU", "text": "我宁愿放弃一个高薪机会，也不愿失去工作中的自主权。"},
  {"id": 13, "anchor": "AU", "text": "在被严格监督、反复要求汇报的环境里，我很难发挥出最好的水平。"},
  {"id": 14, "anchor": "AU", "text": "我更喜欢按自己的标准和方法完成任务，而不是遵循固定流程。"},
  {"id": 15, "anchor": "AU", "text": "能自由安排工作的时间和地点，对我来说比头衔更重要。"},
  {"id": 16, "anchor": "SE", "text": "工作稳定、长期有保障，对我来说非常重要。"},
  {"id": 17, "anchor": "SE", "text": "为了一份稳定的工作，我可以接受相对平缓的发展速度。"},
  {"id": 18, "anchor": "SE", "text": "我希望所在的组织可靠、可预期，让我能放心地规划未来。"},
  {"id": 19, "anchor": "SE", "text": "良好的福利、保障和工作的持续性，是我选择工作的重要标准。"},
  {"id": 20, "anchor": "SE", "text": "相比充满变数的机会，我更愿意选择风险小、可预测的路径。"},
  {"id": 21, "anchor": "EC", "text": "我渴望创办属于自己的企业，或开创一项全新的事业。"},
  {"id": 22, "anchor": "EC", "text": "我享受把一个新点子变成现实的产品、服务或组织的过程。"},
  {"id": 23, "anchor": "EC", "text": "为了实现自己的构想，我愿意承担相当大的风险。"},
  {"id": 24, "anchor": "EC", "text": "为别人打工让我觉得受限，我更想打造完全属于自己的东西。"},
  {"id": 25, "anchor": "EC", "text": "能留下一份由我亲手创造的成果，是我心中职业成功的核心。"},
  {"id": 26, "anchor": "SV", "text": "我希望自己的工作能让世界变得更好、帮助到他人。"},
  {"id": 27, "anchor": "SV", "text": "即使收入较低，只要工作符合我的价值观，我也愿意去做。"},
  {"id": 28, "anchor": "SV", "text": "所做的事对社会或他人有意义，会让我深受激励。"},
  {"id": 29, "anchor": "SV", "text": "我想选择能体现我所信奉理念的职业或组织。"},
  {"id": 30, "anchor": "SV", "text": "如果现有工作与我的价值观冲突，我会认真考虑转行。"},
  {"id": 31, "anchor": "CH", "text": "我喜欢去解决看起来几乎无法解决的难题。"},
  {"id": 32, "anchor": "CH", "text": "任务越困难、竞争越激烈，越能激发我的斗志。"},
  {"id": 33, "anchor": "CH", "text": "日常重复的工作很快就让我厌倦，我需要不断面对新的挑战。"},
  {"id": 34, "anchor": "CH", "text": "战胜强劲的对手或克服巨大的障碍，是我心中职业成功的标志。"},
  {"id": 35, "anchor": "CH", "text": "我希望工作始终能考验我、推着我突破自己的极限。"},
  {"id": 36, "anchor": "LS", "text": "我希望工作与家庭、个人生活之间能保持良好的平衡。"},
  {"id": 37, "anchor": "LS", "text": "我宁愿拒绝一个会严重占用私人时间的晋升机会。"},
  {"id": 38, "anchor": "LS", "text": "对我来说，职业成功意味着生活的各个方面都能协调安排好。"},
  {"id": 39, "anchor": "LS", "text": "我希望所在的组织能理解并尊重我的家庭与个人需求。"},
  {"id": 40, "anchor": "LS", "text": "选择工作的地点和任务时，我会优先考虑能否兼顾个人生活。"}
]
;
const ANCHORS = {
  "TF": {
    "name": "技术/职能型", "en": "Technical/Functional Competence",
    "definition": "以在某一专业领域内的精深能力和卓越表现为职业核心。",

    "strengths": ["专业深度强，对质量要求高", "愿意长期投入学习与钻研", "容易在专业圈内建立口碑"],
    "blindspots": ["可能忽视对全局和人际协作的投入", "对偏离专业的事务耐心不足", "容易把专业标准强加给他人"],
    "fit": ["有清晰专业通道的组织（如专家/资深工程师序列）", "鼓励深耕与持续学习的团队", "研发、分析、设计、咨询等岗位"],
    "avoid": ["被迫长期从事与专业无关的行政或管理事务"],
    "advice": ["争取专业序列的晋升通道，而非只有管理通道", "有意识地练习向非专业人士讲清价值", "通过带教与分享，把个人专长沉淀为团队能力"]

  "GM": {
    "name": "管理型", "en": "General Managerial Competence",
    "definition": "以带领团队、整合资源并对整体成果负责为职业核心。",
    "motivation": "晋升到更高的管理岗位，拥有影响全局的权责。",
    "strengths": ["善于统筹、协调与决策", "能在不确定中承担责任", "关注结果并善于调动他人"],
    "blindspots": ["可能对细节与专业深度投入不足", "过度追求职位与控制感", "在没有权限的情境中容易感到挫败"],
    "fit": ["层级清晰、晋升路径明确的组织", "需要跨部门协作的综合性岗位", "项目负责人、部门管理、运营管理等"],

    "advice": ["尽早争取带项目、带人的机会积累管理经验", "补齐财务、战略与人员管理的基础能力", "保持对业务本质的理解，避免只做'传话人'"]
  },
  "AU": {
    "name": "自主/独立型", "en": "Autonomy/Independence",
    "definition": "以按自己的方式、节奏和标准工作的自由为职业核心。",
    "motivation": "摆脱过多规则与束缚，自己掌控工作的方式。",

    "avoid": ["流程繁琐、监督密集、事事需要审批的环境"],
    "advice": ["寻找或争取结果导向的考核方式", "主动沟通进度，减少他人对'失控'的担忧", "为收入与发展的不确定性准备应对方案"]

  "SE": {

const ANCHOR_ORDER = ['TF', 'GM', 'AU', 'SE', 'EC', 'SV', 'CH', 'LS'];
const ITEMS_PER_ANCHOR = 5;
const BONUS = 4;

// 可复现的伪随机数（mulberry32）
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffleIds(ids, seed) {
  const out = ids.slice();
  const rand = rng(seed);
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

/**
 * questions: [{id, anchor}]；answers: {id: 1..6}；picks: 最认同的题号（可为空）
 * 每个维度：(5 题得分之和 + 4 × 被选中题数) / 5。
 * 主职业锚：得分最高者；并列则全部列出；唯一最高时，若第二名仅低 1 个原始分（0.2）以内，也一并列出。
 */
function score(questions, answers, picks = []) {
  const byId = new Map(questions.map((q) => [q.id, q]));
  const raw = Object.fromEntries(ANCHOR_ORDER.map((a) => [a, 0]));
  for (const q of questions) {
    const v = answers[q.id];
    if (!Number.isInteger(v) || v < 1 || v > 6) throw new Error(`题 ${q.id} 缺少有效答案`);
    raw[q.anchor] += v;
  }
  const uniq = new Set(picks);
  if (uniq.size !== picks.length) throw new Error('最认同的题目不能重复');
  for (const id of uniq) {
    if (!byId.has(id)) throw new Error(`无效的题号 ${id}`);
    raw[byId.get(id).anchor] += BONUS;
  }
  const scores = {};
  for (const a of ANCHOR_ORDER) scores[a] = Math.round((raw[a] / ITEMS_PER_ANCHOR) * 10) / 10;
  const ranking = ANCHOR_ORDER.slice().sort((x, y) => raw[y] - raw[x] || ANCHOR_ORDER.indexOf(x) - ANCHOR_ORDER.indexOf(y));
  const max = raw[ranking[0]];
  let primary = ranking.filter((a) => raw[a] === max);
  if (primary.length === 1 && max - raw[ranking[1]] <= 1) primary = [ranking[0], ranking[1]];
  return { raw, scores, ranking, primary };
}



'use strict';
// 纯前端版本的"假后端"：在浏览器内实现 /api/*，数据存在 localStorage。
// 依赖构建时注入的 QUESTIONS、ANCHORS、ANCHOR_ORDER、shuffleIds、score。
const CFG = { top3Bonus: true, pageSize: 10 };
const DB_KEY='ca_preview_db_v1';
let mem={users:{},nextId:1};
const load=()=>{try{const s=localStorage.getItem(DB_KEY);if(s)return JSON.parse(s)}catch(e){}return mem};
const save=(d)=>{mem=d;try{localStorage.setItem(DB_KEY,JSON.stringify(d))}catch(e){}};
const qById=new Map(QUESTIONS.map(q=>[q.id,q]));
const reply=(status,body)=>new Response(JSON.stringify(body),{status,headers:{'Content-Type':'application/json'}});
const summary=(a)=>({id:a.id,status:a.status,startedAt:a.startedAt,submittedAt:a.submittedAt,primary:a.primary||null});
const reportNo=(a)=>'CA-'+new Date(a.submittedAt||a.startedAt).toISOString().slice(0,10).replace(/-/g,'')+'-'+String(a.id).padStart(6,'0');
function view(a,u){
  const v={id:a.id,status:a.status,name:u.name,reportNo:reportNo(a),config:CFG};
  if(a.status==='draft'){v.questions=a.order.map(id=>({id,text:qById.get(id).text}));v.answers=a.answers}
  else{v.submittedAt=a.submittedAt;v.scores=a.scores;v.primary=a.primary;v.ranking=ANCHOR_ORDER.slice().sort((x,y)=>a.scores[y]-a.scores[x]||ANCHOR_ORDER.indexOf(x)-ANCHOR_ORDER.indexOf(y))}
  return v;
}
async function handle(method,path,headers,body){
  if(path==='/api/config')return reply(200,{...CFG,anchors:ANCHORS,order:ANCHOR_ORDER});
  const db=load();
  if(path==='/api/enter'){
    const name=String(body.name||'').trim();
    if(!name||name.length>30)return reply(400,{error:'请输入姓名（1–30 个字）'});
    const norm=name.toLowerCase();let u=db.users[norm],isNew=!u;
    if(!u)u=db.users[norm]={name,attempts:[]};
    save(db);
    return reply(200,{token:'demo:'+norm,isNew,name:u.name,attempts:u.attempts.slice().reverse().map(summary)});
  }
  const tk=/^Bearer demo:(.+)$/.exec(headers.Authorization||'');
  const u=tk&&db.users[tk[1]];
  if(!u)return reply(401,{error:'请先验证身份'});
  if(path==='/api/logout')return reply(200,{ok:true});
  if(path==='/api/me')return reply(200,{name:u.name,attempts:u.attempts.slice().reverse().map(summary)});
  if(method==='POST'&&path==='/api/attempts'){
    let a=u.attempts.find(x=>x.status==='draft');
    if(!a){const seed=Math.floor(Math.random()*2147483646)+1;a={id:db.nextId++,status:'draft',seed,order:shuffleIds(QUESTIONS.map(q=>q.id),seed),answers:{},startedAt:Date.now()};u.attempts.push(a);save(db)}
    return reply(200,view(a,u));
  }
  const m=/^\/api\/attempts\/(\d+)(?:\/(answers|submit))?$/.exec(path);
  const a=m&&u.attempts.find(x=>x.id===Number(m[1]));
  if(!a)return reply(404,{error:'记录不存在'});
  if(method==='GET')return reply(200,view(a,u));
  if(a.status!=='draft')return reply(409,{error:'该测试已提交'});
  if(m[2]==='answers'){Object.assign(a.answers,body.answers||{});save(db);return reply(200,{saved:Object.keys(a.answers).length})}
  if(m[2]==='submit'){
    const picks=(body.picks||[]).map(Number);
    if(picks.length!==3)return reply(400,{error:'请选出 3 道最认同的题目'});
    let r;try{r=score(QUESTIONS,a.answers,picks)}catch(e){return reply(400,{error:e.message})}
    Object.assign(a,{status:'submitted',top3:picks,scores:r.scores,primary:r.primary,submittedAt:Date.now()});save(db);
    return reply(200,view(a,u));
  }
  return reply(404,{error:'接口不存在'});
}
const realFetch=window.fetch.bind(window);
window.fetch=(url,opts={})=>{
  if(typeof url==='string'&&url.startsWith('/api/'))return handle((opts.method||'GET').toUpperCase(),url,opts.headers||{},opts.body?JSON.parse(opts.body):{});
  return realFetch(url,opts);
};

})();

    const sync = () => {
      S.picks = [...app.querySelectorAll('input:checked')].map((c) => Number(c.value));
      $('#cnt').textContent = S.picks.length; $('#go').disabled = S.picks.length !== 3;
      app.querySelectorAll('input:not(:checked)').forEach((c) => (c.disabled = S.picks.length >= 3));
    };
    app.querySelectorAll('input').forEach((c) => c.addEventListener('change', sync)); sync();
    $('#back').addEventListener('click', () => { S.page = Math.ceil(A.questions.length / pageSize()) - 1; renderQuiz(); });
    $('#go').addEventListener('click', submit);
  }

  async function submit() {
    const btn = $('#go') || $('#next'); if (btn) btn.disabled = true;
    try {
      const r = await api('POST', `/api/attempts/${S.att.id}/submit`, { picks: S.att.config.top3Bonus ? S.picks : [] });
      S.attempts = (await api('GET', '/api/me')).attempts; S.att = r; renderResult(r);
    } catch (e) { S.att.config.top3Bonus ? renderPicks(e.message) : renderQuiz(e.message); }
  }

  // ---------- 结果 ----------
  function radar(scores, order, primary) {
    const C = 170, R = 108, n = order.length, MAX = S.cfg.top3Bonus ? 8.4 : 6;
    const pt = (i, r) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / n; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
    const rings = [1 / 3, 2 / 3, 1].map((v) => `<polygon class="grid" points="${order.map((_, i) => pt(i, R * v).join(',')).join(' ')}"/>`).join('');
    const ticks = [1 / 3, 2 / 3, 1].map((v) => `<text class="tick" x="${C + 4}" y="${C - R * v - 2}">${(MAX * v).toFixed(1).replace('.0', '')}</text>`).join('');
    const axes = order.map((_, i) => `<line class="grid" x1="${C}" y1="${C}" x2="${pt(i, R)[0]}" y2="${pt(i, R)[1]}"/>`).join('');
    const shape = `<polygon class="shape" points="${order.map((c, i) => pt(i, (R * Math.min(scores[c], MAX)) / MAX).join(',')).join(' ')}"/>`;
    const dots = order.map((c, i) => { const [x, y] = pt(i, (R * Math.min(scores[c], MAX)) / MAX); return primary.includes(c) ? `<circle class="pdot" cx="${x}" cy="${y}" r="6"/>` : `<circle class="odot" cx="${x}" cy="${y}" r="3.5"/>`; }).join('');
    const labels = order.map((c, i) => { const [x, y] = pt(i, R + 28); const p = primary.includes(c); return `<text class="rl${p ? ' main' : ''}" x="${x}" y="${y - 6}" text-anchor="middle">${esc(S.cfg.anchors[c].name.replace('型', ''))}</text><text class="rs${p ? ' main' : ''}" x="${x}" y="${y + 9}" text-anchor="middle">${scores[c].toFixed(1)}</text>`; }).join('');
    return `<svg class="radar" viewBox="0 0 340 340" role="img" aria-label="八个职业锚得分雷达图">${rings}${axes}${ticks}${shape}${dots}${labels}</svg>`;
  }
  const list = (arr) => `<ul class="tag-list">${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;

  // ---------- 保存为图片（Canvas 自绘，无需外部库） ----------
  function drawReport(r) {
    const AN = S.cfg.anchors, order = S.cfg.order, MAX = S.cfg.top3Bonus ? 8.4 : 6;
    const W = 1080, P = 56, CW = W - P * 2;
    const FONT = '-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
    const col = { bg: '#ffffff', text: '#1f2933', muted: '#667085', brand: '#2f6fed', line: '#e4e7ec', sel: '#e8f0fe', good: '#12805c', warn: '#b45309', bar: '#9db8f5' };
    function layout(ctx, draw) {
      const font = (size, bold) => `${bold ? '700' : '400'} ${size}px ${FONT}`;
      const lines = (text, size, maxW, bold) => {
        ctx.font = font(size, bold);
        const out = []; let line = '';
        for (const ch of text) { if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; } else line += ch; }
        if (line) out.push(line);
        return out;
      };
      const txt = (str, x, y, size, color, bold, align) => { if (!draw) return; ctx.font = font(size, bold); ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'top'; ctx.fillText(str, x, y); };
      const block = (arr, x, y, size, color, lh, bold) => { arr.forEach((l, i) => txt(l, x, y + i * lh, size, color, bold)); return arr.length * lh; };
      const rr = (x, y, w, h, rad, fill, stroke) => {
        if (!draw) return;
        ctx.beginPath(); ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad); ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
      };
      if (draw) { ctx.fillStyle = col.bg; ctx.fillRect(0, 0, W, 99999); }

      // ---- 顶部大卡片 ----
      const tiles = r.primary.map((c) => { const dl = lines(AN[c].definition, 24, CW - 56 - 76 - 170, false); return { c, dl, h: Math.max(112, 28 + 40 + dl.length * 32 + 24) }; });
      const heroH = 52 + 34 + 70 + 44 + tiles.reduce((a, t) => a + t.h + 16, 0) + 36;
      if (draw) { ctx.fillStyle = col.brand; ctx.fillRect(0, 0, W, heroH); }
      txt(`${fmt(r.submittedAt)} · 报告编号 ${r.reportNo}`, P, 52, 24, 'rgba(255,255,255,.85)');
      txt(`${r.name} 的职业锚报告`, P, 52 + 36, 54, '#ffffff', true);
      txt(r.primary.length > 1 ? '你有两个并列突出的职业锚' : '你最突出的职业锚是', P, 52 + 34 + 70, 26, 'rgba(255,255,255,.9)');
      let y = 52 + 34 + 70 + 44;
      tiles.forEach((t) => {
        rr(P, y, CW, t.h, 20, 'rgba(255,255,255,.16)');
        rr(P + 24, y + (t.h - 84) / 2, 84, 84, 18, '#ffffff');
        txt(t.c, P + 24 + 42, y + (t.h - 84) / 2 + 26, 34, col.brand, true, 'center');
        txt(AN[t.c].name, P + 24 + 84 + 24, y + 24, 36, '#ffffff', true);
        block(t.dl, P + 24 + 84 + 24, y + 24 + 46, 24, 'rgba(255,255,255,.92)', 32);
        txt(r.scores[t.c].toFixed(1), W - P - 24, y + t.h / 2 - 28, 56, '#ffffff', true, 'right');
        txt(`/ ${MAX}`, W - P - 24, y + t.h / 2 + 30, 22, 'rgba(255,255,255,.8)', false, 'right');
        y += t.h + 16;
      });
      y = heroH + 44;

      // ---- 画像：雷达 + 排名 ----
      txt('你的职业锚画像', P, y, 36, col.text, true); y += 52;
      txt('越向外说明该动机对你越重要，加粗的是主职业锚', P, y, 24, col.muted); y += 44;
      const R = 170, cx = P + 236, cy = y + R + 80;
      if (draw) {
        const pt = (i, rr_) => { const t = -Math.PI / 2 + (2 * Math.PI * i) / order.length; return [cx + rr_ * Math.cos(t), cy + rr_ * Math.sin(t)]; };
        ctx.strokeStyle = col.line; ctx.lineWidth = 2;
        [1 / 3, 2 / 3, 1].forEach((f) => { ctx.beginPath(); order.forEach((_, i) => { const [x, yy] = pt(i, R * f); i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }); ctx.closePath(); ctx.stroke(); });
        order.forEach((_, i) => { const [x, yy] = pt(i, R); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, yy); ctx.stroke(); });
        ctx.beginPath();
        order.forEach((c, i) => { const [x, yy] = pt(i, (R * Math.min(r.scores[c], MAX)) / MAX); i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); });
        ctx.closePath(); ctx.fillStyle = 'rgba(47,111,237,.22)'; ctx.fill(); ctx.strokeStyle = col.brand; ctx.lineWidth = 4; ctx.stroke();
        order.forEach((c, i) => {
          const [x, yy] = pt(i, (R * Math.min(r.scores[c], MAX)) / MAX), main = r.primary.includes(c);
          ctx.beginPath(); ctx.arc(x, yy, main ? 9 : 5, 0, 7); ctx.fillStyle = col.brand; ctx.globalAlpha = main ? 1 : 0.6; ctx.fill(); ctx.globalAlpha = 1;
          if (main) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
          const [lx, ly] = pt(i, R + 46);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = font(24, main); ctx.fillStyle = main ? col.text : col.muted; ctx.fillText(AN[c].name.replace('型', ''), lx, ly - 12);
          ctx.font = font(22, main); ctx.fillStyle = main ? col.brand : col.muted; ctx.fillText(r.scores[c].toFixed(1), lx, ly + 14);
        });
      }
      const rx = 590, rw = W - P - rx, rowH = 56;
      r.ranking.forEach((c, i) => {
        const ry = y + 20 + i * rowH, main = r.primary.includes(c);
        if (main) rr(rx - 12, ry - 6, rw + 24, rowH - 4, 12, col.sel);
        txt(String(i + 1), rx, ry + 8, 24, col.muted);
        txt(AN[c].name, rx + 40, ry + 6, 26, col.text, main);
        if (draw) { rr(rx + 230, ry + 14, 130, 14, 4, col.line); rr(rx + 230, ry + 14, Math.max(8, (130 * Math.min(r.scores[c], MAX)) / MAX), 14, 4, main ? col.brand : col.bar); }
        txt(r.scores[c].toFixed(1), rx + rw, ry + 6, 26, col.text, main, 'right');
      });
      y = Math.max(cy + R + 96, y + 20 + 8 * rowH) + 24;
      txt(`分数 = 该维度 5 题均分${S.cfg.top3Bonus ? '，你最认同的 3 句话所属维度各加 0.8 分' : ''}`, P, y, 22, col.muted); y += 64;

      // ---- 主职业锚详解 ----
      const colW = (CW - 24) / 2;
      r.primary.forEach((c) => {
        const a = AN[c];
        txt(a.name, P, y, 40, col.text, true);
        if (draw) { ctx.font = font(40, true); const w = ctx.measureText(a.name).width; txt(a.en, P + w + 16, y + 14, 22, col.muted); }
        y += 64;
        const ml = lines(a.motivation, 28, CW - 56, false);
        const mh = 22 + 30 + ml.length * 40 + 18;
        rr(P, y, CW, mh, 16, col.sel);
        txt('核心动机', P + 28, y + 18, 22, col.brand, true);
        block(ml, P + 28, y + 18 + 32, 28, col.text, 40);
        y += mh + 20;
        const boxes = [['典型优势', a.strengths, col.good, col.good], ['潜在盲区', a.blindspots, col.warn, col.warn], ['适合的岗位与环境', a.fit, col.text, col.brand], ['发展建议', a.advice, col.text, col.brand]];
        const prep = boxes.map(([t, items, tc, dc]) => { const its = items.map((it) => lines(it, 25, colW - 28 - 44, false)); return { t, its, tc, dc, h: 20 + 40 + its.reduce((s, l) => s + l.length * 36 + 8, 0) + 14 }; });
        for (let row = 0; row < 2; row++) {
          const pair = prep.slice(row * 2, row * 2 + 2), rh = Math.max(...pair.map((b) => b.h));
          pair.forEach((b, k) => {
            const bx = P + k * (colW + 24);
            rr(bx, y, colW, rh, 16, null, col.line);
            txt(b.t, bx + 24, y + 18, 26, b.tc, true);
            let iy = y + 18 + 42;
            b.its.forEach((l) => { if (draw) { ctx.beginPath(); ctx.arc(bx + 30, iy + 17, 5, 0, 7); ctx.fillStyle = b.dc; ctx.fill(); } block(l, bx + 44, iy, 25, col.text, 36); iy += l.length * 36 + 8; });
          });
          y += rh + 16;
        }
        const al = lines('不太适合：' + a.avoid.join('；'), 24, CW, false);
        y += block(al, P, y + 4, 24, col.muted, 34) + 56;
      });

      // ---- 次要职业锚 ----
      const sec = r.ranking.filter((c) => !r.primary.includes(c)).slice(0, 2);
      txt('次要职业锚', P, y, 34, col.text, true); y += 56;
      const sp = sec.map((c) => ({ c, dl: lines(AN[c].definition, 24, colW - 48, false) }));
      const sh = Math.max(...sp.map((o) => 18 + 40 + o.dl.length * 34 + 20));
      sp.forEach((o, k) => {
        const bx = P + k * (colW + 24);
        rr(bx, y, colW, sh, 16, null, col.line);
        txt(AN[o.c].name, bx + 24, y + 18, 28, col.text, true);
        txt(r.scores[o.c].toFixed(1), bx + colW - 24, y + 18, 28, col.brand, true, 'right');
        block(o.dl, bx + 24, y + 18 + 42, 24, col.muted, 34);
      });
      y += sh + 44;
      const dis = lines('本测评基于 Schein 职业锚理论，仅作为自我认知参考，不构成录用、诊断或其他决策依据。', 22, CW, false);
      y += block(dis, P, y, 22, col.muted, 32) + 48;
      return y;
    }
    const probe = document.createElement('canvas').getContext('2d');
    const H = layout(probe, false);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    layout(c.getContext('2d'), true);
    return c;
  }

  function saveImage(r) {
    const c = drawReport(r);
    c.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `职业锚报告-${r.name.replace(/[\\/:*?"<>|]/g, '')}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      let box = $('#preview');
      if (!box) { box = document.createElement('div'); box.id = 'preview'; box.className = 'card noprint'; app.appendChild(box); }
      box.innerHTML = '<p class="muted">图片已生成。如果没有自动下载，请长按（电脑上右键）下面的图片，选择"保存图片"。</p><img alt="职业锚报告图片" style="width:100%;border:1px solid var(--line);border-radius:8px">';
      box.querySelector('img').src = url;
      box.scrollIntoView({ behavior: 'smooth' });
    }, 'image/png');
  }

  function renderResult(r) {
    const AN = S.cfg.anchors, order = S.cfg.order, MAX = S.cfg.top3Bonus ? 8.4 : 6;
    const sec = r.ranking.filter((c) => !r.primary.includes(c)).slice(0, 2);
    const box = (title, inner, cls = '') => `<div class="dbox ${cls}"><h3>${title}</h3>${inner}</div>`;
    view(`<section class="rhero"><p class="meta">${esc(fmt(r.submittedAt))} · 报告编号 ${esc(r.reportNo)}</p>
      <h1>${esc(r.name)} 的职业锚报告</h1>
      <p class="lead">${r.primary.length > 1 ? '你有两个并列突出的职业锚' : '你最突出的职业锚是'}</p>
      ${r.primary.map((c) => `<div class="pa"><span class="pcode" aria-hidden="true">${esc(c)}</span><div class="pa-t"><b>${esc(AN[c].name)}</b><span>${esc(AN[c].definition)}</span></div><span class="pscore" title="得分">${r.scores[c].toFixed(1)}<small>/${MAX}</small></span></div>`).join('')}</section>
      <section class="card"><h2>你的职业锚画像</h2><p class="muted">雷达图越向外，说明该动机对你越重要；亮色标记的是你的主职业锚。</p>
        <div class="profile">${radar(r.scores, order, r.primary)}
          <ol class="rank" aria-label="八个维度得分排名">${r.ranking.map((c, i) => `<li class="${r.primary.includes(c) ? 'main' : ''}"><span class="rn">${i + 1}</span><span class="rname">${esc(AN[c].name)}</span><span class="rbar"><i style="width:${Math.min(r.scores[c], MAX) / MAX * 100}%"></i></span><span class="rval">${r.scores[c].toFixed(1)}</span></li>`).join('')}</ol></div>
        <p class="muted small">分数 = 该维度 5 题均分${S.cfg.top3Bonus ? '，你最认同的 3 句话所属维度各加 0.8 分' : ''}。</p></section>
      ${r.primary.map((c) => `<section class="card"><h2>${esc(AN[c].name)} <span class="en">${esc(AN[c].en)}</span></h2>
        <p class="motive"><b>核心动机</b>${esc(AN[c].motivation)}</p>
        <div class="dgrid">${box('典型优势', list(AN[c].strengths), 'good')}${box('潜在盲区', list(AN[c].blindspots), 'warn')}${box('适合的岗位与环境', list(AN[c].fit))}${box('发展建议', list(AN[c].advice))}</div>
        <p class="avoid"><b>不太适合：</b>${esc(AN[c].avoid.join('；'))}</p></section>`).join('')}
      <section class="card"><h2>次要职业锚</h2><div class="sgrid">${sec.map((c) => `<div class="sbox"><div class="sh"><b>${esc(AN[c].name)}</b><span>${r.scores[c].toFixed(1)}</span></div><p>${esc(AN[c].definition)}</p></div>`).join('')}</div></section>
      <p class="muted small card">本测评基于 Schein 职业锚理论，仅作为自我认知参考，不构成录用、诊断或其他决策依据。</p>
      <div class="row noprint"><button id="save">保存为图片</button><button class="ghost" id="print">打印 / 保存为 PDF</button><button class="ghost" id="home">我的记录</button><button class="ghost" id="out">退出</button></div>`);
    $('#print').addEventListener('click', () => window.print());
    $('#save').addEventListener('click', () => saveImage(r));
    $('#home').addEventListener('click', async () => { S.attempts = (await api('GET', '/api/me')).attempts; renderHome(); });
    $('#out').addEventListener('click', logout);
  }

  // ---------- 启动 ----------
  async function render() {
    try { S.cfg = S.cfg || await api('GET', '/api/config'); } catch (e) { /* 忽略，进入时会再试 */ }
    if (!S.token) return renderEnter();
    try {
      const me = await api('GET', '/api/me'); S.name = me.name; S.attempts = me.attempts;
      await afterLogin();
    } catch (e) { setToken(null); renderEnter(); }
  }
  render();
})();

</script>
</body>
</html>
